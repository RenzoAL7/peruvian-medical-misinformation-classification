# Batch piloto reproducible: 2 candidatas por cada uno de seis medios.
# El endpoint `latest` recupera noticias recientes (hasta 48 horas, según NewsData).
batch:
  name: seminario_1_newsdata_12
  endpoint: https://newsdata.io/api/1/latest
  output_dir: data/01_candidates
  report_dir: reports/runs
  run_registry_path: data/00_control/run_registry.csv
  expected_total: 12
  per_source_limit: 2
  language: es
  country: pe
  category: health
  # En cuentas gratuitas NewsData limita los créditos por ventana de 15 minutos.
  # Se reserva margen para no agotar la ventana durante una sola corrida.
  request_delay_seconds: 2.0
  timeout_seconds: 30
  max_requests_per_source: 6
  max_requests_total: 20
  health_queries:
    - salud
    - medicina
    - enfermedad
    - tratamiento
    - medicamento
    - vacuna
    - síntomas
    - prevención
    - cáncer
    - diabetes

sources:
  el_comercio:
    name: El Comercio
    source_dataset: newsdata_el_comercio
    domain: elcomercio.pe
  rpp:
    name: RPP Noticias
    source_dataset: newsdata_rpp
    domain: rpp.pe
  latina:
    name: Latina Noticias
    source_dataset: newsdata_latina
    domain: latinanoticias.pe
  el_peruano:
    name: El Peruano
    source_dataset: newsdata_el_peruano
    domain: elperuano.pe
  peru21:
    name: Perú21
    source_dataset: newsdata_peru21
    domain: peru21.pe
  la_republica:
    name: La República
    source_dataset: newsdata_la_republica
    domain: larepublica.pe
