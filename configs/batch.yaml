# Batch diverso de 12 candidatas textuales. Cada fuente puede aportar como
# máximo 2 noticias; si una página no rinde, las demás cubren el lote.
# Estas páginas públicas están permitidas por robots.txt y no consumen créditos
# de NewsData. El endpoint permanece configurado para pruebas futuras.
batch:
  name: seminario_1_textual_health
  endpoint: https://newsdata.io/api/1/latest
  output_dir: data/01_candidates
  report_dir: reports/runs
  run_registry_path: data/00_control/run_registry.csv
  expected_total: 12
  per_source_limit: 2
  language: es
  country: pe
  category: health
  # Pausa entre solicitudes consecutivas dentro de una misma corrida. No es
  # el tiempo que debe transcurrir entre dos ejecuciones del Colab.
  request_delay_seconds: 1.0
  timeout_seconds: 30
  # Si se vuelve a habilitar una fuente NewsData, estos límites protegen el
  # plan gratuito. `video=0` y `removeduplicate=1` se envían desde el código.
  max_requests_per_source: 2
  max_requests_total: 4
  priority_query_count: 2
  results_per_request: 10
  health_queries:
    - (cáncer OR diabetes OR hipertensión OR anemia OR dengue OR tuberculosis)
    - (vacuna OR medicamento OR tratamiento OR diagnóstico OR síntomas OR prevención)
    - (salud mental OR depresión OR obesidad OR nutrición OR infección)

  # Un término médico y una señal de afirmación deben aparecer en el título o
  # bajada. Es un filtro de ruido; la revisión humana conserva la decisión final.
  candidate_keywords:
    - cáncer
    - tumor
    - diabetes
    - hipertensión
    - anemia
    - dengue
    - tuberculosis
    - sarampión
    - influenza
    - virus
    - infección
    - enfermedad
    - síndrome
    - vacuna
    - medicamento
    - tratamiento
    - diagnóstico
    - síntomas
    - prevención
    - obesidad
    - nutrición
    - depresión
    - ansiedad
    - salud mental
    - corazón
    - cardíaco
    - renal
    - riñón
    - hígado
    - menstruación
    - adulto mayor
    - embarazo
    - lactancia
  candidate_claim_keywords:
    - riesgo
    - síntoma
    - señal
    - causa
    - provoca
    - afecta
    - aumenta
    - reduce
    - previene
    - prevenir
    - tratamiento
    - medicamento
    - vacuna
    - diagnóstico
    - recomienda
    - alerta
    - evidencia
    - estudio
    - mito
    - beneficio
    - complicación
    - enfermedad
    - cómo
    - qué es
    - puede
    - cuidado
  excluded_candidate_keywords:
    - farándula
    - espectáculo
    - congresista
    - elecciones
    - horóscopo

sources:
  el_comercio:
    name: El Comercio
    source_dataset: archive_el_comercio_salud
    domain: elcomercio.pe
    discovery: archive
    archive_urls:
      - https://elcomercio.pe/bienestar/salud-fisica/
    article_link_selector: "a[href*='/bienestar/salud-fisica/']"
    article_url_prefixes:
      - /bienestar/salud-fisica/

  la_republica:
    name: La República
    source_dataset: archive_la_republica_salud
    domain: larepublica.pe
    discovery: archive
    archive_urls:
      - https://larepublica.pe/salud/
      - https://larepublica.pe/tag/salud/
    article_link_selector: "a[href*='/salud/']"
    article_url_prefixes:
      - /salud/

  correo:
    name: Diario Correo
    source_dataset: archive_correo_salud
    domain: diariocorreo.pe
    discovery: archive
    archive_urls:
      - https://diariocorreo.pe/salud/
      - https://diariocorreo.pe/archivo/salud/
    article_link_selector: "a[href*='/salud/']"
    article_url_prefixes:
      - /salud/

  ojo:
    name: Diario Ojo
    source_dataset: archive_ojo_salud
    domain: ojo.pe
    discovery: archive
    archive_urls:
      - https://ojo.pe/salud/
    article_link_selector: "a[href*='/salud/']"
    article_url_prefixes:
      - /salud/

  minsa:
    name: Ministerio de Salud
    source_dataset: archive_minsa_institucional
    domain: www.gob.pe
    discovery: archive
    archive_urls:
      - https://www.gob.pe/institucion/minsa/noticias?filter%5Btype%5D=3
    article_link_selector: "a[href^='/institucion/minsa/noticias/']"
    article_url_prefixes:
      - /institucion/minsa/noticias/

  gestion:
    name: Gestión
    source_dataset: archive_gestion_salud
    domain: gestion.pe
    discovery: archive
    archive_urls:
      - https://gestion.pe/noticias/salud/
    article_link_selector: "a[href*='-noticia/']"
    article_url_prefixes:
      - /peru/

  el_popular:
    name: El Popular
    source_dataset: archive_el_popular_vida
    domain: elpopular.pe
    discovery: archive
    archive_urls:
      - https://elpopular.pe/vida/
    article_link_selector: "a[href*='/vida/']"
    article_url_prefixes:
      - /vida/

  canal_n:
    name: Canal N
    source_dataset: archive_canal_n_salud
    domain: canaln.pe
    discovery: archive
    archive_urls:
      - https://canaln.pe/noticias/salud
    article_link_selector: "a[href*='/actualidad/']"
    allow_selected_article_urls: true
