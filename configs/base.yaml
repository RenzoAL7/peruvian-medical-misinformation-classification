# Configuración reproducible de Seminario 1.
project:
  name: peruvian-medical-misinformation-classification
  stage: seminario_1
  task: binary_text_classification
  seed: 42
  labels: [0, 1]
  excluded_label: EXCLUIDA

corpus:
  language: es
  country_context: PE
  primary_source: el_comercio
  approved_sources: [el_comercio, rpp, latina]
  pilot_size: 200
  target_size: 1000
  target_per_label: 500

data:
  source_manifest: data/raw/source_urls_candidates_pending_period.csv
  collected_records: data/interim/scraped_news.jsonl
  raw_html_dir: data/raw/html
  extraction_log: data/interim/extraction_log.csv
  annotation_template: data/annotations/annotation_template.csv
  final_dataset: data/processed/medical_misinformation_binary.csv

collection:
  start_date: 2026-01-01
  end_date: 2026-09-26
  timeout_seconds: 30
  delay_seconds: 1.0
  max_retries: 2
  max_urls_per_run: 0
  user_agent: peruvian-medical-misinformation-research/0.1
  require_allowlisted_domain: true

annotation:
  allowed_labels: [0, 1, EXCLUIDA]
  evidence_sources: [PubMed, MINSA, INS, EsSalud, OMS, OPS]
  ambiguous_records: exclude_from_final_dataset

split:
  train: 0.70
  validation: 0.15
  test: 0.15
  stratify_by: label
  group_by: canonical_url

models:
  classical:
    - tfidf_naive_bayes
    - tfidf_logistic_regression
    - tfidf_linear_svm
  embeddings:
    - glove_bilstm
    - word2vec_lstm
  transformers:
    - bert_binary_head
    - beto_binary_head
    - roberta_bne_binary_head

evaluation:
  primary_metric: macro_f1
  secondary_metrics: [precision, recall, roc_auc, confusion_matrix]

scope:
  scopus: literature_search_only
  pubmed: label_evidence_only
