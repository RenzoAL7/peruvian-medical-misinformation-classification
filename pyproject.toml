[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "peruvian-medical-misinformation-classification"
version = "0.1.0"
description = "Reproducible binary classification of Spanish medical misinformation related to Peru."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "pandas>=2.2",
    "PyYAML>=6.0",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
scraping = [
    "Scrapy>=2.11",
    "trafilatura>=1.9",
]
corpus = [
    "openpyxl>=3.1",
    "pyarrow>=16.0",
]
training = [
    "accelerate>=0.26",
    "datasets>=3.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "sentence-transformers>=3.0",
    "torch>=2.3",
    "transformers>=4.45",
]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
