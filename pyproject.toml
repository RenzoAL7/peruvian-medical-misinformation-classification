[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recomendador-fuentes-confiables-nlp-xai"
version = "0.1.0"
description = "Recomendación explicable de fuentes confiables en español mediante NLP."
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
