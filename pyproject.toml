[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "peruvian-medical-misinformation-classification"
version = "0.2.0"
description = "Corpus trazable de noticias médicas peruanas para clasificación binaria posterior."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pandas>=2.2",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
training = [
    "accelerate>=0.26",
    "datasets>=3.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "sentence-transformers>=3.0",
    "torch>=2.3",
    "transformers>=4.45",
]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
